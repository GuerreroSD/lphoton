[package]
name = "lphoton"
version = "0.1.0"
description = "LPhoton: launcher liviano que unifica Steam, Epic Games y GOG"
authors = ["Luis Barrios Urbina", "Alan Troncoso Jara"]
edition = "2021"
rust-version = "1.82"

[lib]
# El sufijo _lib evita choques de nombre con el binario en Windows.
name = "lphoton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Caché local de la biblioteca (RNF7)
rusqlite = { version = "0.32", features = ["bundled"] }
# API key de Steam en el administrador de credenciales de Windows
keyring = { version = "3", features = ["windows-native"] }
# Steam Web API, appdetails y portadas del CDN (TLS nativo de Windows: schannel)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Fases siguientes (ver LPHOTON.md §3):
# sysinfo = "0.32"                                          # métricas (fases 4 y 6)
# windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
