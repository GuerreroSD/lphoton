[package]
name = "lphoton"
version = "0.7.0"
description = "LPhoton: launcher liviano que unifica Steam, Epic Games y GOG"
authors = ["Luis Barrios Urbina", "Alan Troncoso Jara"]
edition = "2021"
rust-version = "1.82"

[lib]
# El sufijo _lib evita choques de nombre con el binario en Windows.
name = "lphoton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Una sola instancia: abrir LPhoton de nuevo muestra la ventana existente
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Caché local de la biblioteca (RNF7)
rusqlite = { version = "0.32", features = ["bundled"] }
# API key de Steam en el administrador de credenciales de Windows
keyring = { version = "3", features = ["windows-native"] }
# Steam Web API, appdetails y portadas del CDN (TLS nativo de Windows: schannel)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# Procesos, CPU y RAM (modo ligero, detección del juego, métricas)
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Win32: SetPriorityClass, EmptyWorkingSet (modo ligero, RF3)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
